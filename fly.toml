# fly.toml app configuration file generated for sf-book-club on 2026-02-22T19:13:53-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sf-book-club'
primary_region = 'sjc'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DATABASE_PATH = '/data/bookclub.sqlite'

[processes]
  app = 'node server.js'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
